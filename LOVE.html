<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Любовь ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    button {
      margin: 10px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      background: #ddd;
    }

    .hidden {
      display: none;
    }

    .heart {
      position: fixed;
      bottom: -50px;
      animation: fly 6s linear forwards;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fly {
      from {
        transform: translateY(0);
        opacity: 1;
      }

      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section id="questionContainer">
      <h1>Ты меня любишь? ❤️</h1>
      <button id="yesBtn">Да</button>
      <button id="noBtn">Нет</button>
    </section>

    <section id="successContainer" class="hidden">
      <h1>Я так и знал! ❤️</h1>
      <p>Ты лучшая!</p>
    </section>
  </main>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const questionContainer = document.getElementById('questionContainer');
    const successContainer = document.getElementById('successContainer');

    function dodgeButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;

      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.max(0, Math.random() * maxX) + 'px';
      noBtn.style.top = Math.max(0, Math.random() * maxY) + 'px';
    }

    noBtn.addEventListener('mouseenter', dodgeButton);

    noBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      dodgeButton();
    }, { passive: false });

    yesBtn.addEventListener('click', () => {
      questionContainer.classList.add('hidden');
      successContainer.classList.remove('hidden');
      startHearts();
    });

    let heartsStarted = false;

    function startHearts() {
      if (heartsStarted) return;

      heartsStarted = true;
      setInterval(createHeart, 150);
    }

    function createHeart() {
      const heart = document.createElement('div');

      heart.classList.add('heart');
      heart.textContent = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 3 + 's';
      heart.style.fontSize = Math.random() * 20 + 20 + 'px';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }
  </script>
</body>
</html>
